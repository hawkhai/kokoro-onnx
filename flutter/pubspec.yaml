name: flutter_kokoro
description: "Flutter plugin for Kokoro TTS - text-to-speech using Kokoro-82M ONNX model"
version: 0.1.0
homepage: https://github.com/thewh1teagle/kokoro-onnx

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.8.0
  ffi: ^2.1.0
  path_provider: ^2.1.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: FlutterKokoroPluginCApi
  assets:
    - assets/config.json
